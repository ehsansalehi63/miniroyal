<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hoodieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="500" height="500" rx="32" fill="#f8fafc" />
  <circle cx="250" cy="250" r="210" fill="#e0f2fe" opacity="0.6" />

  <g filter="url(#dropShadow)">
    <!-- Hood Back -->
    <path d="M 170 140 C 170 70, 330 70, 330 140 C 310 110, 190 110, 170 140 Z" fill="#1e293b" />
    <path d="M 180 135 C 180 85, 320 85, 320 135 C 300 115, 200 115, 180 135 Z" fill="#f1f5f9" opacity="0.8" />

    <!-- Sleeves -->
    <path d="M 140 160 L 60 290 L 105 315 L 175 190 Z" fill="#1d4ed8" />
    <path d="M 360 160 L 440 290 L 395 315 L 325 190 Z" fill="#1d4ed8" />

    <!-- Sleeve Cuffs -->
    <path d="M 60 290 L 48 310 L 93 335 L 105 315 Z" fill="url(#ribGrad)" />
    <path d="M 440 290 L 452 310 L 407 335 L 395 315 Z" fill="url(#ribGrad)" />

    <!-- Main Body -->
    <path d="M 145 150 Q 250 165 355 150 L 375 390 Q 250 400 125 390 Z" fill="url(#hoodieBg)" />

    <!-- Bottom Ribbing -->
    <path d="M 125 390 Q 250 400 375 390 L 375 425 Q 250 435 125 425 Z" fill="url(#ribGrad)" />

    <!-- Hood Cords -->
    <path d="M 215 150 Q 210 210 220 235" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M 285 150 Q 290 210 280 235" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="220" cy="237" r="5" fill="#facc15" />
    <circle cx="280" cy="237" r="5" fill="#facc15" />

    <!-- Collar V Stitch -->
    <path d="M 230 155 L 250 180 L 270 155" fill="none" stroke="#3b82f6" stroke-width="3" />

    <!-- Kangaroo Pocket -->
    <path d="M 175 300 Q 250 295 325 300 L 345 375 Q 250 385 155 375 Z" fill="#1e40af" stroke="#3b82f6" stroke-width="2" />
    <path d="M 175 300 L 195 340" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <path d="M 325 300 L 305 340" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

    <!-- Bear Chest Patch Graphic -->
    <g transform="translate(250, 230)">
      <circle cx="0" cy="0" r="32" fill="#fef08a" />
      <circle cx="-25" cy="-22" r="12" fill="#fef08a" />
      <circle cx="25" cy="-22" r="12" fill="#fef08a" />
      <circle cx="-25" cy="-22" r="6" fill="#f59e0b" />
      <circle cx="25" cy="-22" r="6" fill="#f59e0b" />
      <circle cx="-10" cy="-6" r="4" fill="#1e293b" />
      <circle cx="10" cy="-6" r="4" fill="#1e293b" />
      <ellipse cx="0" cy="8" rx="12" ry="9" fill="#ffffff" />
      <ellipse cx="0" cy="4" rx="5" ry="3.5" fill="#1e293b" />
      <path d="M -4 9 Q 0 14 4 9" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Royal Crown Mini Badge -->
    <g transform="translate(250, 185) scale(0.6)">
      <path d="M -20 10 L -25 -10 L -10 -2 L 0 -18 L 10 -2 L 25 -10 L 20 10 Z" fill="#f59e0b" />
      <circle cx="-25" cy="-12" r="3" fill="#ef4444" />
      <circle cx="0" cy="-20" r="3.5" fill="#ef4444" />
      <circle cx="25" cy="-12" r="3" fill="#ef4444" />
    </g>
  </g>
</svg>
