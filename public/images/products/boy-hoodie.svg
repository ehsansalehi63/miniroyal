<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Studio Background Lighting -->
    <radialGradient id="studioLight" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- 3D Fabric Material Gradient -->
    <linearGradient id="navyFabric3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="pocket3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="fleeceHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Photorealistic Drop Shadow Filter -->
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="fabricTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" opacity="0.12" />
    </filter>
  </defs>

  <!-- Studio Floor & Background -->
  <rect width="800" height="1000" fill="url(#studioLight)" />
  <ellipse cx="400" cy="880" rx="320" ry="40" fill="#020617" opacity="0.2" filter="blur(20px)" />

  <!-- Main Garment Group with Photorealistic Studio Lighting -->
  <g filter="url(#photoShadow)">
    <!-- Hood Inner Depth -->
    <path d="M 280 180 C 280 80, 520 80, 520 180 C 480 130, 320 130, 280 180 Z" fill="#0f172a" />
    <path d="M 300 170 C 300 100, 500 100, 500 170 Z" fill="#e2e8f0" opacity="0.9" />

    <!-- Left Sleeve 3D Fold -->
    <path d="M 240 220 L 100 420 L 170 460 L 290 280 Z" fill="url(#navyFabric3D)" filter="url(#fabricTexture)" />
    <!-- Right Sleeve 3D Fold -->
    <path d="M 560 220 L 700 420 L 630 460 L 510 280 Z" fill="url(#navyFabric3D)" filter="url(#fabricTexture)" />

    <!-- Sleeve Ribbed Cuffs -->
    <path d="M 100 420 L 80 450 L 150 490 L 170 460 Z" fill="#172554" />
    <path d="M 700 420 L 720 450 L 650 490 L 630 460 Z" fill="#172554" />

    <!-- Main Torso Body 3D Volume -->
    <path d="M 240 210 Q 400 230 560 210 L 580 680 Q 400 700 220 680 Z" fill="url(#navyFabric3D)" filter="url(#fabricTexture)" />
    <!-- Torso Lighting Overlay -->
    <path d="M 240 210 Q 400 230 560 210 L 580 680 Q 400 700 220 680 Z" fill="url(#fleeceHighlight)" />

    <!-- Bottom Ribbed Hem -->
    <path d="M 220 680 Q 400 700 580 680 L 580 740 Q 400 760 220 740 Z" fill="#172554" />

    <!-- 3D Kangaroo Pocket with Fabric Shadows -->
    <path d="M 290 510 Q 400 500 510 510 L 535 650 Q 400 665 265 650 Z" fill="url(#pocket3D)" stroke="#3b82f6" stroke-width="2" />
    <!-- Pocket Welts -->
    <path d="M 290 510 L 320 570" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
    <path d="M 510 510 L 480 570" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />

    <!-- Realistic Braided Hood Drawstrings -->
    <path d="M 350 210 Q 340 320 360 380" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M 450 210 Q 460 320 440 380" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- Drawstring Metallic Aglets -->
    <rect x="353" y="380" width="14" height="24" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <rect x="433" y="380" width="14" height="24" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2" />

    <!-- Chest Patch Logo (Bear Embossed Leather Badge) -->
    <g transform="translate(400, 360)">
      <rect x="-55" y="-45" width="110" height="90" rx="20" fill="#78350f" stroke="#f59e0b" stroke-width="4" />
      <text x="0" y="5" fill="#fef08a" font-family="Vazirmatn, sans-serif" font-size="18" font-weight="900" text-anchor="middle">MINI ROYAL</text>
      <text x="0" y="28" fill="#fef08a" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">★ KIDS HOODIE ★</text>
    </g>

    <!-- Stitching Seams Details -->
    <path d="M 240 210 L 220 680" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
    <path d="M 560 210 L 580 680" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  </g>
</svg>
