<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="babySuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="babyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="#fffbe completed" stroke="#fef3c7" fill-opacity="0.2" />
  <circle cx="250" cy="250" r="210" fill="#fef9c3" opacity="0.6" />

  <g filter="url(#babyShadow)">
    <!-- Onesie Main Body -->
    <path d="M 175 140 Q 250 155 325 140 L 350 200 L 320 350 Q 280 390 250 390 Q 220 390 180 350 L 150 200 Z" fill="url(#babySuitGrad)" />
    
    <!-- Short Sleeves -->
    <path d="M 175 140 L 115 180 L 135 210 L 165 190 Z" fill="#fde68a" />
    <path d="M 325 140 L 385 180 L 365 210 L 335 190 Z" fill="#fde68a" />

    <!-- Sleeve Trim -->
    <path d="M 115 180 L 135 210" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <path d="M 385 180 L 365 210" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

    <!-- Envelope Neckline -->
    <path d="M 180 140 Q 250 175 320 140" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
    <path d="M 170 145 C 190 120, 310 120, 330 145" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

    <!-- Snap Buttons Bottom -->
    <path d="M 180 350 Q 250 400 320 350" fill="#f59e0b" />
    <circle cx="220" cy="370" r="5" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <circle cx="250" cy="375" r="5" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <circle cx="280" cy="370" r="5" fill="#ffffff" stroke="#d97706" stroke-width="2" />

    <!-- Cute Teddy Bear Face Graphic -->
    <g transform="translate(250, 240)">
      <circle cx="0" cy="0" r="45" fill="#78350f" />
      <circle cx="-35" cy="-35" r="16" fill="#78350f" />
      <circle cx="35" cy="-35" r="16" fill="#78350f" />
      <circle cx="-35" cy="-35" r="8" fill="#fde68a" />
      <circle cx="35" cy="-35" r="8" fill="#fde68a" />
      
      <!-- Snout -->
      <ellipse cx="0" cy="10" rx="20" ry="14" fill="#fef3c7" />
      <ellipse cx="0" cy="4" rx="8" ry="5" fill="#451a03" />
      <path d="M -6 12 Q 0 18 6 12" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />

      <!-- Eyes -->
      <circle cx="-14" cy="-8" r="5" fill="#ffffff" />
      <circle cx="14" cy="-8" r="5" fill="#ffffff" />
      <circle cx="-14" cy="-8" r="3" fill="#451a03" />
      <circle cx="14" cy="-8" r="3" fill="#451a03" />
      
      <!-- Rosy Cheeks -->
      <circle cx="-25" cy="8" r="7" fill="#f43f5e" opacity="0.6" />
      <circle cx="25" cy="8" r="7" fill="#f43f5e" opacity="0.6" />
    </g>

    <!-- Matching Baby Hat on Side -->
    <g transform="translate(370, 100) rotate(15)">
      <path d="M -40 0 C -40 -40, 40 -40, 40 0 Z" fill="#fde68a" stroke="#d97706" stroke-width="3" />
      <rect x="-45" y="-2" width="90" height="14" rx="5" fill="#78350f" />
      <circle cx="0" cy="-40" r="10" fill="#fef3c7" />
    </g>
  </g>
</svg>
