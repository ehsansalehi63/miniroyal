<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="jcktGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="jcktShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#450a0a" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="32" fill="#fef2f2" />
  <circle cx="250" cy="250" r="210" fill="#fee2e2" opacity="0.6" />

  <g filter="url(#jcktShadow)">
    <!-- Fur Trim Hood -->
    <path d="M 160 130 C 160 50, 340 50, 340 130 C 315 90, 185 90, 160 130 Z" fill="#d97706" />
    <path d="M 170 125 C 170 60, 330 60, 330 125 Z" fill="#78350f" />

    <!-- Sleeves -->
    <path d="M 140 150 L 65 280 L 110 305 L 175 180 Z" fill="#b91c1c" />
    <path d="M 360 150 L 435 280 L 390 305 L 325 180 Z" fill="#b91c1c" />

    <!-- Jacket Body -->
    <path d="M 145 145 Q 250 160 355 145 L 370 410 Q 250 420 130 410 Z" fill="url(#jcktGrad)" />

    <!-- Puffer Baffles Stitching Lines -->
    <path d="M 140 210 Q 250 220 360 210" fill="none" stroke="#7f1d1d" stroke-width="3" />
    <path d="M 135 270 Q 250 282 365 270" fill="none" stroke="#7f1d1d" stroke-width="3" />
    <path d="M 132 330 Q 250 342 368 330" fill="none" stroke="#7f1d1d" stroke-width="3" />

    <!-- Zipper Front -->
    <path d="M 250 155 L 250 415" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <rect x="244" y="240" width="12" height="20" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="2" />

    <!-- Pockets with Metal Buttons -->
    <rect x="160" y="320" width="65" height="50" rx="10" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />
    <rect x="275" y="320" width="65" height="50" rx="10" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="192" cy="332" r="4" fill="#f59e0b" />
    <circle cx="307" cy="332" r="4" fill="#f59e0b" />
  </g>
</svg>
