<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="studioLightPink" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </radialGradient>

    <linearGradient id="silkRose3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="80%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="tulleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="goldSash3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="photoShadowDress" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" />
      <feOffset dx="0" dy="28" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#studioLightPink)" />
  <ellipse cx="400" cy="900" rx="340" ry="45" fill="#881337" opacity="0.2" filter="blur(22px)" />

  <g filter="url(#photoShadowDress)">
    <!-- Silk Satin Bodice -->
    <path d="M 270 200 Q 400 220 530 200 L 500 380 Q 400 395 300 380 Z" fill="url(#silkRose3D)" />

    <!-- Puff Lace Sleeves -->
    <ellipse cx="230" cy="230" rx="60" ry="50" fill="#f43f5e" opacity="0.9" />
    <ellipse cx="570" cy="230" rx="60" ry="50" fill="#f43f5e" opacity="0.9" />
    <ellipse cx="230" cy="230" rx="45" ry="35" fill="#fbcfe8" opacity="0.7" />
    <ellipse cx="570" cy="230" rx="45" ry="35" fill="#fbcfe8" opacity="0.7" />

    <!-- Tulle Skirt Layers with 3D Depth Fold Lines -->
    <path d="M 300 380 Q 140 580 100 780 Q 400 840 700 780 Q 660 580 500 380 Z" fill="url(#tulleGradient)" />

    <!-- Pleats & Curvature Shadows -->
    <path d="M 300 380 Q 260 580 220 788" fill="none" stroke="#881337" stroke-width="4" opacity="0.35" />
    <path d="M 350 385 Q 330 585 310 795" fill="none" stroke="#881337" stroke-width="4" opacity="0.35" />
    <path d="M 400 390 Q 400 590 400 800" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.4" />
    <path d="M 450 385 Q 470 585 490 795" fill="none" stroke="#881337" stroke-width="4" opacity="0.35" />
    <path d="M 500 380 Q 540 580 580 788" fill="none" stroke="#881337" stroke-width="4" opacity="0.35" />

    <!-- Gold Satin Belt Waist Sash -->
    <rect x="290" y="365" width="220" height="35" rx="10" fill="url(#goldSash3D)" />

    <!-- 3D Ribbon Bow -->
    <g transform="translate(400, 382)">
      <path d="M 0 0 C -40 -35, -80 -20, -55 25 C -30 45, -10 10, 0 0 Z" fill="#f59e0b" />
      <path d="M 0 0 C 40 -35, 80 -20, 55 25 C 30 45, 10 10, 0 0 Z" fill="#f59e0b" />
      <path d="M -8 0 Q -25 55 -40 80 L -15 82 L 0 8 Z" fill="#d97706" />
      <path d="M 8 0 Q 25 55 40 80 L 15 82 L 0 8 Z" fill="#d97706" />
      <circle cx="0" cy="0" r="14" fill="#fef08a" stroke="#d97706" stroke-width="3" />
    </g>

    <!-- Pearl Pearl Embellishments -->
    <circle cx="340" cy="225" r="6" fill="#ffffff" />
    <circle cx="400" cy="235" r="7" fill="#ffffff" />
    <circle cx="460" cy="225" r="6" fill="#ffffff" />
  </g>
</svg>
