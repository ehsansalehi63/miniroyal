<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dressBodice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="skirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldSash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dressShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#881337" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="#fff1f2" />
  <circle cx="250" cy="250" r="210" fill="#fce7f3" opacity="0.7" />

  <g filter="url(#dressShadow)">
    <!-- Puff Sleeves -->
    <ellipse cx="140" cy="165" rx="35" ry="30" fill="#f472b6" />
    <ellipse cx="360" cy="165" rx="35" ry="30" fill="#f472b6" />
    <ellipse cx="140" cy="165" rx="25" ry="20" fill="#fbcfe8" opacity="0.6" />
    <ellipse cx="360" cy="165" rx="25" ry="20" fill="#fbcfe8" opacity="0.6" />

    <!-- Bodice -->
    <path d="M 165 145 Q 250 160 335 145 L 320 240 Q 250 248 180 240 Z" fill="url(#dressBodice)" />

    <!-- Neckline & Lace Trim -->
    <path d="M 180 145 Q 250 180 320 145" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <path d="M 180 145 Q 250 180 320 145" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Tulle Skirt Layers -->
    <!-- Outer Tulle Layer 3 (Back) -->
    <path d="M 180 240 Q 90 350 70 430 Q 250 460 430 430 Q 410 350 320 240 Z" fill="#fda4af" opacity="0.5" />
    <!-- Tulle Layer 2 -->
    <path d="M 180 240 Q 105 345 90 420 Q 250 450 410 420 Q 395 345 320 240 Z" fill="url(#skirtGrad)" />

    <!-- Skirt Folds/Pleats -->
    <path d="M 180 240 Q 170 340 160 425" fill="none" stroke="#be123c" stroke-width="3" opacity="0.4" />
    <path d="M 215 242 Q 210 345 205 430" fill="none" stroke="#be123c" stroke-width="3" opacity="0.4" />
    <path d="M 250 245 Q 250 350 250 432" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" />
    <path d="M 285 242 Q 290 345 295 430" fill="none" stroke="#be123c" stroke-width="3" opacity="0.4" />
    <path d="M 320 240 Q 330 340 340 425" fill="none" stroke="#be123c" stroke-width="3" opacity="0.4" />

    <!-- Sparkle / Floral Embroidery Details on Skirt -->
    <circle cx="160" cy="360" r="5" fill="#fef08a" />
    <circle cx="200" cy="390" r="7" fill="#ffffff" />
    <circle cx="250" cy="370" r="6" fill="#fef08a" />
    <circle cx="300" cy="395" r="7" fill="#ffffff" />
    <circle cx="340" cy="355" r="5" fill="#fef08a" />

    <!-- Gold Waist Sash & Big Bow -->
    <rect x="175" y="232" width="150" height="20" rx="6" fill="url(#goldSash)" />
    
    <!-- Big Ribbon Bow -->
    <g transform="translate(250, 242)">
      <path d="M 0 0 C -25 -20, -50 -10, -35 15 C -20 25, -5 5, 0 0 Z" fill="#f59e0b" />
      <path d="M 0 0 C 25 -20, 50 -10, 35 15 C 20 25, 5 5, 0 0 Z" fill="#f59e0b" />
      <path d="M -5 0 Q -15 35 -25 50 L -10 52 L 0 5 Z" fill="#d97706" />
      <path d="M 5 0 Q 15 35 25 50 L 10 52 L 0 5 Z" fill="#d97706" />
      <circle cx="0" cy="0" r="8" fill="#fef08a" />
    </g>
  </g>
</svg>
