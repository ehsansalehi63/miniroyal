name: Notify MiniRoyal deployment

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Hostinger webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "Webhook secrets are not configured; Hostinger Git remains the deploy path."
            exit 0
          fi
          payload='{"ref":"refs/heads/main","after":"'"$GITHUB_SHA"'","sender":{"login":"github-actions"}}'
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl --fail-with-body --max-time 15 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $GITHUB_RUN_ID" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data "$payload"
